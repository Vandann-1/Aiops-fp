name: AIOps Service Desk CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Django Checks, Tests & Benchmark Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          python manage.py check

      - name: Verify Migrations Status
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Execute Full Test Suite (120 Tests)
        run: |
          python manage.py test --verbosity=2

      - name: Execute AIOps Benchmark Evaluation
        run: |
          python manage.py evaluate_aiops
