services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops_service_desk_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=aiops_service_desk.settings
      - PYTHONUNBUFFERED=1
      # Note: Secret key can be configured via environment variable in production
    volumes:
      # Persistent SQLite database mount (Default development & capstone demonstration storage)
      - ./db.sqlite3:/app/db.sqlite3
      - ./static:/app/static
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8000/login/'); exit(0 if resp.status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
